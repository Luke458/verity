[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-qc"
version = "0.22.0"
description = "Deterministic, temporal and semantic evidence system for retail transactional QC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyyaml>=6",
]

[project.optional-dependencies]
test = ["pytest>=8"]
spark = ["pyspark>=3.5", "delta-spark>=3.2"]
forecast = ["chronos-forecasting>=2.3"]
classical = ["statsmodels>=0.14"]
tspulse = ["granite-tsfm>=0.3"]
delta = ["deltalake>=1,<2"]
text = ["transformers>=5.6,<6", "torch>=2.6"]

[project.scripts]
qcgen = "qcgen.cli:main"
qc = "qc.cli:main"

[tool.setuptools.packages.find]
include = ["qc*", "qcgen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "unit: fast pure-logic tests",
    "integration: end-to-end runs over generated scenarios",
    "slow: tests that take more than a few seconds",
    "model: tests requiring optional model extras (chronos, tspulse, text)",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "BLE", "RUF100"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
files = ["qc", "qcgen"]
