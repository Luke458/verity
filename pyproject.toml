[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-qc"
version = "0.19.0"
description = "Deterministic, temporal and semantic evidence system for retail transactional QC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyyaml>=6",
]

[project.optional-dependencies]
test = ["pytest>=8"]
spark = ["pyspark>=3.5", "delta-spark>=3.2"]
forecast = ["chronos-forecasting>=2.3"]
classical = ["statsmodels>=0.14"]
tspulse = ["granite-tsfm>=0.3"]
delta = ["deltalake>=1,<2"]
text = ["transformers>=5.6,<6", "torch>=2.6"]

[project.scripts]
qcgen = "qcgen.cli:main"
qc = "qc.cli:main"

[tool.setuptools.packages.find]
include = ["qc*", "qcgen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
