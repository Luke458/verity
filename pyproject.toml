[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verity"
version = "0.23.0"
description = "Automated QC for versioned retail transactional table refreshes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyyaml>=6",
]

[project.optional-dependencies]
test = ["pytest>=8"]
delta = ["deltalake>=1,<2"]
# Research sandbox only (experiments/); never needed by the engine.
experiments = ["scikit-learn>=1.5"]

[project.scripts]
qcgen = "qcgen.cli:main"
qc = "qc.cli:main"

[tool.setuptools.packages.find]
include = ["qc*", "qcgen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "unit: fast pure-logic tests",
    "integration: end-to-end runs over generated scenarios",
    "slow: tests that take more than a few seconds",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE", "RUF100"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
files = ["qc", "qcgen", "experiments"]
