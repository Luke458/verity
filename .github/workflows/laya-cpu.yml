name: Optional pinned Laya CPU integration
on:
  workflow_dispatch:
jobs:
  cpu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m venv .venv
          .venv/bin/pip install -e '.[test,delta]'
          python -m venv .venv-laya
          .venv-laya/bin/pip install --extra-index-url https://download.pytorch.org/whl/cpu -r optional/laya-requirements.lock
      - run: |
          .venv-laya/bin/python optional/laya_service.py --prepare .laya/ci
          mkdir -p reports
          .venv-laya/bin/python optional/laya_service.py --model-dir .laya/ci/service-model --timeout 60 > reports/laya-service.log 2>&1 &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8766/health; then break; fi
            sleep 2
          done
          .venv/bin/python -m optional.laya_smoke
          .venv/bin/python -m optional.laya_compare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laya-cpu-integration
          path: reports/
